name: CodeGraph CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  codegraph-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Initialize & Verify CodeGraph
        run: |
          npx -y @colbymchenry/codegraph init
          npx -y @colbymchenry/codegraph status

      - name: Build Next.js
        run: npm run build
